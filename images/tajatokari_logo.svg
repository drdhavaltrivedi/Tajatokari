<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073c1c" />
      <stop offset="50%" stop-color="#0e5a2b" />
      <stop offset="100%" stop-color="#1b8a47" />
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043" />
      <stop offset="100%" stop-color="#ff5722" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="100%" stop-color="#ffb74d" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="100%" stop-color="#4caf50" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#073c1c" flood-opacity="0.35" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ff5722" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Main Squircle Outer Shield Badge -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle Decorative Outer Ring -->
  <rect x="44" y="44" width="424" height="424" rx="98" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.15" />

  <!-- TOKARI (Basket) Handle Curve -->
  <path d="M 160 250 C 160 140, 352 140, 352 250" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" filter="url(#shadow)" />
  <path d="M 172 250 C 172 154, 340 154, 340 250" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6" />

  <!-- ORGANIC VEGGIES BURSTING OUT OF BASKET -->
  
  <!-- Left Fresh Leaf -->
  <path d="M 230 250 Q 140 180 170 110 Q 250 140 230 250 Z" fill="url(#leafGrad)" />
  <path d="M 230 250 Q 190 170 170 110" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Right Fresh Leaf -->
  <path d="M 282 250 Q 372 180 342 110 Q 262 140 282 250 Z" fill="url(#leafGrad)" />
  <path d="M 282 250 Q 322 170 342 110" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Central Fresh Organic Tomato / Produce Accent -->
  <circle cx="256" cy="200" r="48" fill="url(#accentOrange)" filter="url(#glow)" />
  <!-- Tomato Highlight -->
  <ellipse cx="238" cy="184" rx="14" ry="8" fill="#ffffff" opacity="0.5" transform="rotate(-25 238 184)" />
  <!-- Tomato Stem / Crown Leaf -->
  <path d="M 256 156 Q 246 142 232 146 Q 250 152 256 156 Q 262 152 280 146 Q 266 142 256 156 Z" fill="#81c784" />

  <!-- TOKARI (Basket Body) -->
  <path d="M 120 250 C 120 370, 170 410, 256 410 C 342 410, 392 370, 392 250 Z" fill="#ffffff" filter="url(#shadow)" />

  <!-- Basket Rim / Lip Accent -->
  <path d="M 104 250 C 104 235, 408 235, 408 250 C 408 265, 104 265, 104 250 Z" fill="url(#goldGrad)" />
  
  <!-- Basket Woven Pattern Details (Lattice Cutouts) -->
  <path d="M 160 280 Q 256 295 352 280" fill="none" stroke="#0e5a2b" stroke-width="7" stroke-linecap="round" opacity="0.15" />
  <path d="M 176 320 Q 256 335 336 320" fill="none" stroke="#0e5a2b" stroke-width="7" stroke-linecap="round" opacity="0.15" />
  <path d="M 198 360 Q 256 370 314 360" fill="none" stroke="#0e5a2b" stroke-width="7" stroke-linecap="round" opacity="0.15" />

  <!-- Vertical Woven Strands -->
  <path d="M 200 270 L 210 380" fill="none" stroke="#0e5a2b" stroke-width="6" stroke-linecap="round" opacity="0.15" />
  <path d="M 256 272 L 256 390" fill="none" stroke="#0e5a2b" stroke-width="6" stroke-linecap="round" opacity="0.15" />
  <path d="M 312 270 L 302 380" fill="none" stroke="#0e5a2b" stroke-width="6" stroke-linecap="round" opacity="0.15" />

  <!-- 100% Organic Spark Starburst Emblem -->
  <g transform="translate(370, 80)">
    <circle cx="0" cy="0" r="28" fill="url(#accentOrange)" filter="url(#glow)" />
    <path d="M 0 -16 L 4 -4 L 16 0 L 4 4 L 0 16 L -4 4 L -16 0 L -4 -4 Z" fill="#ffffff" />
  </g>
</svg>
